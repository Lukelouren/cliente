<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de CPF</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
                                             
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
        }

        h1 {
            color: #333;
            font-size: 1.6rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitulo {
            color: #888;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 24px;
        }

        label {
            display: block;
            color: #444;
            font-size: 0.9rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            letter-spacing: 1px;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        input.valido {
            border-color: #22c55e;
            background-color: #f0fdf4;
        }

        input.invalido {
            border-color: #ef4444;
            background-color: #fef2f2;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .resultado {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            font-size: 0.95rem;
            display: none;
        }

        .resultado.sucesso {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .resultado.erro {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Validador de CPF</h1>
        <p class="subtitulo">Digite um CPF para verificar se é válido</p>

        <label for="cpf">CPF:</label>
        <input 
            type="text" 
            id="cpf" 
            placeholder="000.000.000-00" 
            maxlength="14"
            autocomplete="off"
        >

        <button onclick="validar()">Validar CPF</button>

        <div id="resultado" class="resultado"></div>
    </div>

    <script>
        // ===== Função de validação do CPF =====
        function validarCPF(cpf) {
            // Remove caracteres não numéricos
            cpf = cpf.replace(/[^\d]/g, '');

            // Verifica se tem 11 dígitos
            if (cpf.length !== 11) return false;

            // Rejeita CPFs com todos os dígitos iguais
            if (/^(\d)\1{10}$/.test(cpf)) return false;

            // Valida os dois dígitos verificadores
            for (let t = 9; t < 11; t++) {
                let soma = 0;
                for (let i = 0; i < t; i++) {
                    soma += parseInt(cpf[i]) * ((t + 1) - i);
                }
                const digito = ((soma * 10) % 11) % 10;
                if (parseInt(cpf[t]) !== digito) return false;
            }

            return true;
        }

        // ===== Função que aplica a máscara enquanto digita =====
        function aplicarMascara(input) {
            let valor = input.value.replace(/\D/g, '').slice(0, 11);
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d)/, '$1.$2');
            valor = valor.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            input.value = valor;
        }

        // ===== Função principal chamada pelo botão =====
        function validar() {
            const input = document.getElementById('cpf');
            const resultado = document.getElementById('resultado');
            const cpf = input.value.trim();

            // Remove classes de estado anterior
            input.classList.remove('valido', 'invalido');
            resultado.className = 'resultado';

            // Verifica se o campo está vazio
            if (cpf === '') {
                resultado.textContent = 'Por favor, digite um CPF.';
                resultado.classList.add('erro');
                return;
            }

            // Executa a validacao
            if (validarCPF(cpf)) {
                resultado.textContent = '✅ CPF válido!';
                resultado.classList.add('sucesso');
                input.classList.add('valido');
            } else {
                resultado.textContent = '❌ CPF inválido!';
                resultado.classList.add('erro');
                input.classList.add('invalido');
            }
        }

        // ===== Eventos =====
        const campoCpf = document.getElementById('cpf');

        // Aplica mascara enquanto o usuario digita
        campoCpf.addEventListener('input', function () {
            aplicarMascara(this);
        });

        // Permite validar pressionando Enter
        campoCpf.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                validar();
            }
        });
    </script>
</body>
</html>
